<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Carom</title>
<style>
:root{--bg2:#3a2515;--btn1:var(--btn1);--btn2:var(--btn2);--bd:var(--bd);--sel:var(--sel);--bgfull:radial-gradient(ellipse at top,#3a2515,#1d130c 70%) fixed;--bg:#1d130c;--panel:#2a1c11;--ink:#f1e4c8;--mute:#b79d73;--gold:#d4a84b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bgfull);color:var(--ink);font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;padding:8px 8px 10px;overflow:hidden}
.top{width:100%;max-width:640px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;transition:.2s}
.pl.on{box-shadow:0 0 0 2px var(--gold),0 0 14px color-mix(in srgb,var(--gold) 50%,transparent)}
.av{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid #0006}
.av.w{background:radial-gradient(circle at 35% 30%,#fff,#d8c9a0)}.av.b{background:radial-gradient(circle at 35% 30%,#5a4d44,#0e0a08)}
.nm{font-size:.8rem;color:var(--mute);line-height:1}.pt{font-size:1.5rem;font-weight:700;line-height:1.1}
.got{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;min-height:8px}.got i{width:8px;height:8px;border-radius:50%;display:block}
.i-w{background:#f6ecd0}.i-b{background:#2a211b;border:1px solid #888}.i-q{background:#d8343c}
.stage{position:relative;flex:none}
canvas{display:block;border-radius:14px;touch-action:none;box-shadow:0 12px 34px #000b}
#s{margin:8px 0 2px;min-height:1.4rem;font-size:1.05rem;color:var(--gold);text-align:center}
.ctl{width:100%;max-width:640px}
.pw{height:8px;border-radius:5px;background:#0006;overflow:hidden;margin:4px 0 8px}#pf{height:100%;width:0;background:linear-gradient(90deg,#4caf50,#ffc107,#e53935)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(#0008,#0004);border:1px solid var(--bd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a6,#c58a1f);border:2px solid #5a3a0a}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:#0006;border:1px solid var(--bd)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#e0a030;border:2px solid #5a3a0a}
.bt{display:flex;gap:8px}.bt button{flex:1}
button{background:linear-gradient(var(--btn1),var(--btn2));color:var(--ink);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}.ov.on{display:flex}
.md{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:22px;width:min(92vw,380px);text-align:center}
.md h2{margin:0 0 4px;color:var(--gold);font-size:2rem}.md p{color:var(--mute);margin:.3rem 0 .8rem}.md button{display:block;width:100%;margin:8px 0;font-size:1.1rem}
</style></head><body>
<div class="top"><div class="pl" id="p0"><span class="av w"></span><div><div class="nm" id="n0">You (white)</div><div class="pt" id="t0">0</div><div class="got" id="g0"></div></div></div>
<div class="pl" id="p1"><span class="av b"></span><div><div class="nm" id="n1">Computer (black)</div><div class="pt" id="t1">0</div><div class="got" id="g1"></div></div></div></div>
<div class="stage"><canvas id="c"></canvas></div>
<div id="s"></div>
<div class="ctl"><div class="pw"><div id="pf"></div></div>
<input type="range" id="x" min="100" max="500" value="300" aria-label="Move striker"><div class="bt"><button id="menu">New game</button></div></div>
<div class="ov on" id="mo"><div class="md"><h2>Carom</h2><p>Pocket all your coins before your rival. The red queen is worth 3 points.</p>
<button data-m="e">Play computer: easy</button><button data-m="h">Play computer: hard</button><button data-m="2">Two players, one device</button>
<p style="font-size:.85rem">Slide the striker, then drag back on the board and let go to shoot.</p></div></div>
<div class="ov" id="eo"><div class="md"><h2 id="et"></h2><p id="ed"></p><button id="again">Play again</button></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const LO=34,HI=566,CR=13.5,SR=17,PR=27,MAXV=30,FR=.988,BY=[490,110];
const PK=[[LO+3,LO+3],[HI-3,LO+3],[LO+3,HI-3],[HI-3,HI-3]].map(([x,y])=>({x,y}));
let coins,st,turn,phase='menu',score,got,pocketed,drag,mode='e',rot=false,fx=[],AC,board,scale=1,DPR=1,hint='';
function snd(f,d,v,type){if(window.GR_MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),q=AC.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f*.6,AC.currentTime+d);q.gain.setValueAtTime(v,AC.currentTime);q.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(q).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function mk(x,y,t){return{x,y,vx:0,vy:0,r:CR,m:1,t,alive:1}}
function setup(m){mode=m;coins=[mk(300,300,'q')];
 for(let k=0;k<6;k++){const a=k*Math.PI/3+Math.PI/6;coins.push(mk(300+27.5*Math.cos(a),300+27.5*Math.sin(a),k%2?'b':'w'))}
 for(let k=0;k<12;k++){const a=k*Math.PI/6,R=k%2?47.6:55;coins.push(mk(300+R*Math.cos(a),300+R*Math.sin(a),k%2?'b':'w'))}
 st={x:300,y:BY[0],vx:0,vy:0,r:SR,m:1.7,t:'s',alive:1};score=[0,0];got=[[],[]];turn=0;rot=false;fx=[];drag=null;phase='aim';
 $('n1').textContent=m==='2'?'Player 2 (black)':'Computer (black)';$('n0').textContent=m==='2'?'Player 1 (white)':'You (white)';
 $('mo').classList.remove('on');$('eo').classList.remove('on');place();hud();say()}
function place(){st.y=BY[turn];st.x=turn&&rot?600-+$('x').value:+$('x').value;st.vx=st.vy=0;st.alive=1}
const aiT=()=>mode!=='2'&&turn===1;
function hud(){for(let i=0;i<2;i++){$('t'+i).textContent=score[i];$('p'+i).classList.toggle('on',phase!=='over'&&turn===i);
 $('g'+i).innerHTML=got[i].map(t=>'<i class="i-'+t+'"></i>').join('')}}
function say(t){$('s').textContent=t!==undefined?t:(phase==='over'?'':aiT()?'Computer is thinking…':(turn?(mode==='2'?'Player 2':'Computer'):(mode==='2'?'Player 1':'Your'))+(mode==='2'||turn?"'s turn":' turn')+(hint?' · '+hint:''))}
// physics
const bodies=()=>coins.filter(c=>c.alive).concat(st.alive?[st]:[]);
function wall(b){if(b.x<LO+b.r){b.x=LO+b.r;b.vx=Math.abs(b.vx)*.82;if(Math.abs(b.vx)>3)snd(520,.05,.1)}if(b.x>HI-b.r){b.x=HI-b.r;b.vx=-Math.abs(b.vx)*.82;if(Math.abs(b.vx)>3)snd(520,.05,.1)}
 if(b.y<LO+b.r){b.y=LO+b.r;b.vy=Math.abs(b.vy)*.82;if(Math.abs(b.vy)>3)snd(520,.05,.1)}if(b.y>HI-b.r){b.y=HI-b.r;b.vy=-Math.abs(b.vy)*.82;if(Math.abs(b.vy)>3)snd(520,.05,.1)}}
function hit(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mn=a.r+b.r;if(d>=mn||!d)return;const nx=dx/d,ny=dy/d,ov=mn-d,im=1/a.m+1/b.m;
 a.x-=nx*ov/a.m/im;a.y-=ny*ov/a.m/im;b.x+=nx*ov/b.m/im;b.y+=ny*ov/b.m/im;const vn=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(vn<=0)return;
 const J=1.9*vn/im;a.vx-=J*nx/a.m;a.vy-=J*ny/a.m;b.vx+=J*nx/b.m;b.vy+=J*ny/b.m;if(vn>1.5)snd(700+vn*25,.07,Math.min(.35,vn/30),'square')}
function physics(){const B=bodies();
 for(let s=0;s<4;s++){for(const b of B){b.x+=b.vx/4;b.y+=b.vy/4;wall(b)}
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++)if(B[i].alive&&B[j].alive)hit(B[i],B[j]);
  for(const b of B)if(b.alive)for(const p of PK)if(Math.hypot(b.x-p.x,b.y-p.y)<PR-2){b.alive=0;b.vx=b.vy=0;pocketed.push(b);fx.push({x:p.x,y:p.y,t:0});snd(150,.3,.4,'sine')}}
 let mv=false;for(const b of B){if(!b.alive)continue;b.vx*=FR;b.vy*=FR;if(Math.hypot(b.vx,b.vy)<.1)b.vx=b.vy=0;else mv=true}
 if(!mv)endShot()}
function shoot(dx,dy,pw){const L=Math.hypot(dx,dy)||1;st.vx=dx/L*pw;st.vy=dy/L*pw;pocketed=[];phase='move';hint='';snd(260,.12,.35);say('')}
function free(x,y){return coins.every(c=>!c.alive||Math.hypot(c.x-x,c.y-y)>CR*2+1)}
function endShot(){const me=turn?'b':'w';let keep=false,foul=false;
 for(const p of pocketed){if(p===st){foul=true;continue}
  if(p.t==='q'){score[turn]+=3;got[turn].push('q');keep=true}else if(p.t===me){score[turn]++;got[turn].push(p.t);keep=true}else{score[1-turn]++;got[1-turn].push(p.t)}}
 if(foul){keep=false;score[turn]=Math.max(0,score[turn]-1);const i=got[turn].map((t,k)=>t===me?k:-1).filter(k=>k>=0).pop();
  if(i!==undefined){got[turn].splice(i,1);score[turn]=Math.max(0,score[turn]-1);const c=coins.find(c=>!c.alive&&c.t===me);if(c){let x=300,y=300,k=0;while(!free(x,y)&&k++<40){x=300+Math.cos(k)*k*3;y=300+Math.sin(k)*k*3}c.x=x;c.y=y;c.alive=1}}}
 const w=coins.filter(c=>c.alive&&c.t==='w').length,b=coins.filter(c=>c.alive&&c.t==='b').length;
 if(!w||!b){phase='over';hud();const d=score[0]===score[1]?'Draw':score[0]>score[1]?(mode==='2'?'Player 1':'You'):(mode==='2'?'Player 2':'Computer');
  $('et').textContent=d==='Draw'?'Draw':d+(d==='You'?' win!':' wins!');$('ed').textContent='Final score '+score[0]+' to '+score[1];setTimeout(()=>$('eo').classList.add('on'),700);snd(660,.6,.3,'sine');say('');return}
 if(!keep){turn=1-turn;rot=mode==='2'&&turn===1}$('x').value=300;phase='aim';place();hud();hint=foul?'Foul! Striker pocketed':'';say();if(foul)setTimeout(()=>{hint='';say()},2200);if(aiT())setTimeout(aiTurn,900)}
// AI
function seg(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx-px,ay+t*dy-py)}
function aiTurn(){if(phase!=='aim'||!aiT())return;const hard=mode==='h',sy=BY[1],mine=coins.filter(c=>c.alive&&(c.t==='b'||c.t==='q'));let best=null;
 for(const c of mine)for(const p of PK){const dx=c.x-p.x,dy=c.y-p.y,L=Math.hypot(dx,dy),gx=c.x+dx/L*(CR+SR),gy=c.y+dy/L*(CR+SR);
  if(coins.some(o=>o!==c&&o.alive&&seg(c.x,c.y,p.x,p.y,o.x,o.y)<CR*2))continue;
  for(let x=100;x<=500;x+=10){const ax=gx-x,ay=gy-sy,al=Math.hypot(ax,ay);if(ay<8)continue;const cs=(ax*-dx+ay*-dy)/(al*L);if(cs<.55)continue;
   if(coins.some(o=>o!==c&&o.alive&&seg(x,sy,gx,gy,o.x,o.y)<CR+SR))continue;const sc=cs*2-al/1800-L/2500+Math.random()*(hard?.02:.25);if(!best||sc>best.s)best={s:sc,x,ax,ay,al,L,cs}}}
 let x,a,pw;if(best){x=best.x;a=Math.atan2(best.ay,best.ax)+(Math.random()-.5)*(hard?.012:.07);pw=(.012*best.L*1.15+1)/(1.23*best.cs)+.012*best.al+3+(hard?0:Math.random()*4)}
 else{x=100+Math.random()*400;a=Math.atan2(300-sy,300-x)+(Math.random()-.5)*.3;pw=14+Math.random()*8}
 st.x=x;st.y=sy;$('x').value=600-x;setTimeout(()=>{if(phase==='aim')shoot(Math.cos(a),Math.sin(a),Math.min(MAXV,Math.max(9,pw)))},650)}
// drawing
function makeBoard(){const S=Math.round(cv.width/DPR*DPR),o=document.createElement('canvas');o.width=o.height=cv.width;const c=o.getContext('2d');const k=cv.width/600;c.scale(k,k);
 let gr=c.createLinearGradient(0,0,600,600);gr.addColorStop(0,'#6b4220');gr.addColorStop(.5,'#3b2210');gr.addColorStop(1,'#5a3718');c.fillStyle=gr;c.beginPath();c.roundRect(0,0,600,600,22);c.fill();
 c.strokeStyle='#0008';c.lineWidth=3;c.strokeRect(LO-3,LO-3,HI-LO+6,HI-LO+6);c.strokeStyle='#c99a5a55';c.lineWidth=2;c.beginPath();c.roundRect(5,5,590,590,18);c.stroke();
 gr=c.createLinearGradient(LO,LO,HI,HI);gr.addColorStop(0,'#f2dcab');gr.addColorStop(.5,'#ead19a');gr.addColorStop(1,'#dfc088');c.fillStyle=gr;c.fillRect(LO,LO,HI-LO,HI-LO);
 let sd=7;const rn=()=>(sd=(sd*16807)%2147483647)/2147483647;c.lineWidth=1;for(let i=0;i<110;i++){c.strokeStyle='rgba(120,80,30,'+(.04+rn()*.07)+')';const y=LO+rn()*(HI-LO);c.beginPath();c.moveTo(LO,y);c.bezierCurveTo(200,y+rn()*8-4,400,y+rn()*8-4,HI,y+rn()*6-3);c.stroke()}
 c.strokeStyle='#5a3418';c.fillStyle='#b3261e';c.lineWidth=2;c.strokeRect(LO+16,LO+16,HI-LO-32,HI-LO-32);
 for(let q=0;q<4;q++){c.save();c.translate(300,300);c.rotate(q*Math.PI/2);c.translate(-300,-300);const y=BY[0];c.lineWidth=2;c.strokeStyle='#5a3418';
  c.beginPath();c.moveTo(106,y-15);c.lineTo(494,y-15);c.moveTo(106,y+15);c.lineTo(494,y+15);c.stroke();
  for(const x of[106,494]){c.beginPath();c.arc(x,y,15,0,7);c.stroke();c.fillStyle='#b3261e';c.beginPath();c.arc(x,y,9,0,7);c.fill()}c.restore()}
 c.lineWidth=2;c.strokeStyle='#5a3418';for(const r of[78,70]){c.beginPath();c.arc(300,300,r,0,7);c.stroke()}c.beginPath();c.arc(300,300,16,0,7);c.stroke();c.fillStyle='#b3261e';c.beginPath();c.arc(300,300,6,0,7);c.fill();
 for(let k=0;k<8;k++){c.save();c.translate(300,300);c.rotate(k*Math.PI/4);c.beginPath();c.ellipse(0,-45,7,13,0,0,7);c.stroke();c.restore()}
 for(const p of PK){const dx=300-p.x,dy=300-p.y,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;c.beginPath();c.moveTo(p.x+ux*50,p.y+uy*50);c.lineTo(p.x+ux*125,p.y+uy*125);c.stroke();c.beginPath();c.arc(p.x+ux*140,p.y+uy*140,12,0,7);c.stroke()}
 for(const p of PK){gr=c.createRadialGradient(p.x,p.y,4,p.x,p.y,PR+4);gr.addColorStop(0,'#000');gr.addColorStop(.8,'#1a1008');gr.addColorStop(1,'#3a2410');c.fillStyle=gr;c.beginPath();c.arc(p.x,p.y,PR+3,0,7);c.fill();c.strokeStyle='#c99a5a';c.lineWidth=2;c.stroke()}
 board=o}
function coin(c){const t=c.t,P={w:['#fffaf0','#d9c8a0','#b8a67c'],b:['#5e5047','#1a130e','#000'],q:['#ff6a70','#b8141c','#6e0a10'],s:['#fff1b8','#e0a030','#8a5a0a']}[t];
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(c.x+2,c.y+3,c.r,c.r*.95,0,0,7);g.fill();
 const r=g.createRadialGradient(c.x-c.r*.35,c.y-c.r*.4,1,c.x,c.y,c.r);r.addColorStop(0,P[0]);r.addColorStop(.75,P[1]);r.addColorStop(1,P[2]);g.fillStyle=r;g.beginPath();g.arc(c.x,c.y,c.r,0,7);g.fill();
 g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.stroke();g.strokeStyle=t==='b'?'rgba(255,255,255,.25)':'rgba(0,0,0,.25)';for(const k of[.68,.4]){g.beginPath();g.arc(c.x,c.y,c.r*k,0,7);g.stroke()}
 if(t==='s'){g.strokeStyle='rgba(90,58,10,.6)';g.lineWidth=2;g.beginPath();g.arc(c.x,c.y,c.r*.8,0,7);g.stroke();for(let k=0;k<6;k++){const a=k*Math.PI/3;g.beginPath();g.moveTo(c.x+Math.cos(a)*c.r*.3,c.y+Math.sin(a)*c.r*.3);g.lineTo(c.x+Math.cos(a)*c.r*.7,c.y+Math.sin(a)*c.r*.7);g.stroke()}}
 g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(c.x-c.r*.35,c.y-c.r*.4,c.r*.3,c.r*.18,-.6,0,7);g.fill()}
function ray(dx,dy){let best=1e9,hitc=null;const L=Math.hypot(dx,dy);dx/=L;dy/=L;
 for(const c of coins){if(!c.alive)continue;const fx2=c.x-st.x,fy2=c.y-st.y,pr=fx2*dx+fy2*dy;if(pr<=0)continue;const d2=fx2*fx2+fy2*fy2-pr*pr,R=SR+CR;if(d2>R*R)continue;const t=pr-Math.sqrt(R*R-d2);if(t<best){best=t;hitc=c}}
 for(const[a,b,lim]of[[dx,st.x,LO+SR],[dx,st.x,HI-SR],[dy,st.y,LO+SR],[dy,st.y,HI-SR]]){if(Math.abs(a)>1e-6){const t=(lim-b)/a;if(t>0&&t<best){best=t;hitc=null}}}
 return{t:best,c:hitc,dx,dy}}
function ok(){return coins.every(c=>!c.alive||Math.hypot(c.x-st.x,c.y-st.y)>CR+SR)}
function draw(){const k=cv.width/600;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.setTransform(k,0,0,k,0,0);
 g.save();if(rot&&phase!=='menu'){g.translate(600,600);g.rotate(Math.PI)}g.drawImage(board,0,0,600,600);
 for(const c of coins)if(c.alive)coin(c);
 if(st.alive){coin(st);if(phase==='aim'&&!aiT()&&!ok()){g.strokeStyle='#ff3b30';g.lineWidth=3;g.beginPath();g.arc(st.x,st.y,SR+5,0,7);g.stroke()}}
 if(drag&&phase==='aim'&&!aiT()){let dx=st.x-drag.x,dy=st.y-drag.y;const l=Math.hypot(dx,dy);if(l>6){const p=Math.min(l,160)/160,R=ray(dx,dy);const ex=st.x+R.dx*R.t,ey=st.y+R.dy*R.t;
  g.setLineDash([6,8]);g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2.5;g.beginPath();g.moveTo(st.x,st.y);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);
  g.strokeStyle='rgba(255,255,255,.7)';g.beginPath();g.arc(ex,ey,SR,0,7);g.stroke();
  if(R.c){const nx=R.c.x-ex,ny=R.c.y-ey,nl=Math.hypot(nx,ny);g.strokeStyle='rgba(255,230,120,.95)';g.lineWidth=3;g.beginPath();g.moveTo(R.c.x,R.c.y);g.lineTo(R.c.x+nx/nl*70,R.c.y+ny/nl*70);g.stroke()}
  g.strokeStyle='rgba(255,255,255,.4)';g.beginPath();g.moveTo(st.x,st.y);g.lineTo(st.x-dx/l*Math.min(l,160)*.5,st.y-dy/l*Math.min(l,160)*.5);g.stroke();$('pf').style.width=p*100+'%'}}
 else if(phase!=='move')$('pf').style.width='0';

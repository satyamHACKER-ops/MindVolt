<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Rush</title>
<style>
:root{--bg2:#3a2515;--btn1:#7a5230;--btn2:#53351c;--bd:#9a7040;--sel:#1b110a;--bgfull:radial-gradient(ellipse at top,#3a2515,#1d130c 70%) fixed;--bg:#1d130c;--panel:#2a1c11;--ink:#f1e4c8;--mute:#b79d73;--gold:#d4a84b}
*{box-sizing:border-box}
body{margin:0;background:var(--bgfull);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.wrap{width:min(100%,460px);text-align:center}
h1{color:var(--gold);margin:.4rem 0;font-size:2.2rem}
.card{background:var(--panel);border:1px solid #6b4a2a;border-radius:8px;padding:18px;margin-bottom:12px}
#hud{display:flex;justify-content:space-around;font-size:1.4rem;font-weight:700}
#hud span{color:var(--mute);font-weight:500;font-size:1rem;display:block}
#bar{height:8px;background:var(--sel);border-radius:4px;overflow:hidden;margin-bottom:12px}
#fill{height:100%;width:100%;background:var(--gold);transition:width 1s linear}
#q{font-size:3.4rem;font-weight:700;margin:14px 0}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{background:linear-gradient(var(--btn1),var(--btn2));color:var(--ink);border:1px solid var(--bd);border-radius:6px;padding:16px;font:inherit;font-weight:700;font-size:1.8rem;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold)}
button.ok{background:#2e7d32}button.bad{background:#b3261e}
select{width:100%;background:var(--sel);color:var(--ink);border:1px solid #6b4a2a;border-radius:4px;padding:10px;font:inherit;font-size:1.2rem;margin:10px 0}
p{font-size:1.2rem;margin:.4rem 0;color:var(--mute)}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<h1>Math Rush</h1>
<div id="start" class="card"><p>Solve as many as you can in 60 seconds. A wrong answer costs 2 seconds.</p>
<select id="lvl" aria-label="Level"><option value="1">Easy: add and subtract</option><option value="2">Medium: bigger numbers and times tables</option><option value="3">Hard: all four operations</option></select>
<button id="go" style="width:100%">Start</button><p id="bestS"></p></div>
<div id="game" hidden>
<div class="card" id="hud"><div id="sc">0<span>Score</span></div><div id="tm">60<span>Seconds</span></div><div id="st">0<span>Streak</span></div></div>
<div id="bar"><div id="fill"></div></div>
<div class="card"><div id="q"></div><div id="opts"></div></div></div>
<div id="end" class="card" hidden><h1 id="fs"></h1><p id="fd"></p><button id="again" style="width:100%;margin-top:10px">Play again</button></div>
</div>
<script>
const $=id=>document.getElementById(id);let lvl=1,score=0,streak=0,time=60,tm,ans,asked=0,right=0,AC,lock=false;
const r=n=>Math.floor(Math.random()*n)+1,key=()=>'mr_best'+lvl;
const getBest=()=>{try{return +localStorage.getItem(key())||0}catch(e){return 0}};
function beep(f,d){if(window.GR_MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function bestText(){lvl=+$('lvl').value;$('bestS').textContent='Best score on this level: '+getBest()}
$('lvl').onchange=bestText;bestText();
function gen(){const ops=lvl===1?['+','-']:lvl===2?['+','-','×']:['+','-','×','÷'],op=ops[r(ops.length)-1],mx=[0,20,100,200][lvl],m=[0,0,12,15][lvl];let a,b;
 if(op==='+'){a=r(mx);b=r(mx);ans=a+b}else if(op==='-'){a=r(mx)+1;b=r(a-1);ans=a-b}else if(op==='×'){a=r(m)+1;b=r(m)+1;ans=a*b}else{b=r(11)+1;ans=r(11)+1;a=b*ans}
 $('q').textContent=a+' '+op+' '+b;const pool=[ans-1,ans+1,ans-2,ans+2,ans+10,ans-10,ans+b,ans-b].filter(v=>v>=0&&v!==ans),s=new Set([ans]);
 pool.sort(()=>Math.random()-.5);for(const v of pool){if(s.size>=4)break;s.add(v)}while(s.size<4)s.add(ans+r(20));
 $('opts').innerHTML=[...s].sort(()=>Math.random()-.5).map(v=>`<button data-v="${v}">${v}</button>`).join('');lock=false}
$('opts').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;lock=true;asked++;
 if(+b.dataset.v===ans){b.classList.add('ok');score+=10+Math.min(streak,10);streak++;right++;beep(660,.1)}
 else{b.classList.add('bad');streak=0;time=Math.max(0,time-2);beep(180,.25)}
 hud();setTimeout(()=>time>0?gen():0,250)};
function hud(){$('sc').firstChild.nodeValue=score;$('tm').firstChild.nodeValue=time;$('st').firstChild.nodeValue=streak;$('fill').style.width=time/60*100+'%'}
function begin(){lvl=+$('lvl').value;score=0;streak=0;time=60;asked=0;right=0;$('start').hidden=true;$('end').hidden=true;$('game').hidden=false;hud();gen();
 clearInterval(tm);tm=setInterval(()=>{time--;hud();if(time<=0)finish()},1000)}
function finish(){clearInterval(tm);const best=Math.max(score,getBest());try{localStorage.setItem(key(),best)}catch(e){}
 $('game').hidden=true;$('end').hidden=false;$('fs').textContent='Time up! Score '+score;
 $('fd').textContent=right+' correct out of '+asked+(asked?' ('+Math.round(right/asked*100)+'%)':'')+'. Best: '+best+'.';beep(440,.4)}
$('go').onclick=begin;$('again').onclick=()=>{$('end').hidden=true;$('start').hidden=false;bestText()};
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4'&&!$('game').hidden){const b=$('opts').children[e.key-1];b&&b.click()}});
</script><script>addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='cfg')return;var r=document.documentElement.style;for(var k in d.vars)r.setProperty(k,d.vars[k]);window.GR_MUTE=d.mute});try{parent.postMessage({type:'ready'},'*')}catch(e){}</script>
</body></html>

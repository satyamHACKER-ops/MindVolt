<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d130c">
<title>MindVolt</title>
<link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head><body>
<header><img src="assets/mindvolt-logo.png" class="brand-logo" alt="MindVolt — Games & Music"></header>
<div class="tools"><button id="set">Settings</button><button id="fs">Full screen</button><button id="inst" hidden>Install app</button></div>
<div id="chip" hidden><span id="chipT"></span><button id="chipB" aria-label="Play or pause music">⏸</button></div>
<main class="grid" id="grid"></main>
<p class="credit">Built and created by <a id="dev" target="_blank" rel="noopener">Satyam Pramod Shukla</a></p>
<section id="stage"><div id="bar"><button id="back">Home</button><span id="gt"></span><button id="set2">Settings</button><button id="quit">Quit</button></div><div id="frames"></div></section>
<section id="music"><div id="mbar"><button id="mback">Home</button><span>Music</span><span></span></div>
<div class="mbody"><div class="disc">♪</div><div id="now">Nothing playing</div>
<div class="ctl"><input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek"><span id="tt">0:00</span></div>
<div class="ctl c2"><button id="prev" aria-label="Previous">⏮</button><button id="pp" class="big" aria-label="Play or pause">▶</button><button id="next" aria-label="Next">⏭</button></div>
<div class="ctl"><span>Volume</span><input type="range" id="vol" min="0" max="1" step=".05" value=".6" aria-label="Volume"><button id="shuf" aria-pressed="false">Shuffle: off</button></div>
<input type="file" id="file" accept="audio/*" multiple hidden><label for="file" class="btn wide">Add music from your device</label>
<div id="list"></div></div></section>
<div id="settings" class="ov"><div class="sheet"><h2>Settings</h2>
<div class="row"><span>Sound effects</span><button id="sfx" aria-pressed="true">On</button></div>
<h3>Theme</h3><div id="themes"></div>
<h3>Background photo</h3><div class="row"><input type="file" id="bgf" accept="image/*" hidden><label for="bgf" class="btn">Choose photo</label><button id="bgx">Remove photo</button></div>
<div class="row"><span>Photo dimming</span><input type="range" id="dim" min="0" max="85" value="45" aria-label="Photo dimming"></div>
<button id="sclose" class="wide">Done</button></div></div>
<audio id="au"></audio>
<div id="welcome" class="ov show"><div class="sheet center"><img src="assets/mindvolt-logo.png" class="brand-logo welcome-logo" alt="MindVolt — Games & Music"><h2>Welcome to MindVolt</h2><p>Built and created by <a id="dev2" target="_blank" rel="noopener">Satyam Pramod Shukla</a></p><p class="small">Works offline. Your games stay safe if you step out of them.</p><button id="enter" class="wide">Start playing</button></div></div>
<script src="app.js"></script>
</body></html>
